name: Tauri Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android:
    name: Build Tauri Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install NDK
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> $GITHUB_ENV

          # Add command-line tools and platform tools to PATH
          export PATH="$ANDROID_SDK_PATH/cmdline-tools/latest/bin:$ANDROID_SDK_PATH/cmdline-tools/16.0/bin:$ANDROID_SDK_PATH/platform-tools:$PATH"
          echo "$ANDROID_SDK_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_PATH/platform-tools" >> $GITHUB_PATH

          # Accept all licenses
          yes | sdkmanager --licenses || true

          # Install Android 34 platform, build tools, and NDK
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

          # Export NDK path variables
          echo "NDK_HOME=$ANDROID_SDK_PATH/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_PATH/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Cache Rust & Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Initialize Tauri Android Project (if not initialized)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android configuration..."
            npx tauri android init
          fi

      - name: Build Web Assets
        run: npm run build

      - name: Build Tauri Android APK (Release)
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        run: |
          npx tauri android build --apk

      - name: Build Tauri Android APK (Debug)
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        run: |
          npx tauri android build --debug --apk

      - name: Locate and Collect APKs
        id: collect_apks
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          find src-tauri/gen/android -name "*.aab" -exec cp {} artifacts/ \; 2>/dev/null || true
          echo "Generated artifacts in ./artifacts:"
          ls -la artifacts/ || true

      - name: Upload APK & Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-build-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: warn
